name: Artist Guard standalone export

on:
  push:
    branches:
      - test/artist-guard-offline-export

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout export branch
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile downloads/discogs_bot_verify_v8_1_artist_guard_test.py

      - name: Upload standalone Python file
        uses: actions/upload-artifact@v4
        with:
          name: discogs-bot-v8-1-artist-guard-test
          path: downloads/discogs_bot_verify_v8_1_artist_guard_test.py
          if-no-files-found: error
          retention-days: 1
