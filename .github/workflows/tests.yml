name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  standalone-export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Validate standalone Artist Guard syntax
        run: python -m py_compile downloads/discogs_bot_verify_v8_1_artist_guard_test.py
      - name: Upload standalone Python file
        uses: actions/upload-artifact@v4
        with:
          name: discogs-bot-v8-1-artist-guard-test
          path: downloads/discogs_bot_verify_v8_1_artist_guard_test.py
          if-no-files-found: error
          retention-days: 1
